<title>Touchigh — AI search visibility, on autopilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOUCHIGH DESIGN SYSTEM
   orange #FF642D · ink #191B23 · white · cool grays · Inter · rounded SaaS
   ============================================================ */
:root{
  --orange:#FF642D; --orange-l:#FF8C43; --orange-d:#C33909; --orange-t:#FFF3D9;
  --ink:#191B23; --white:#FFFFFF;
  --violet:#8649E1; --violet-l:#AB6CFE; --blue:#006DCA; --blue-b:#008FF8;
  --green:#009F81; --red:#FF4953; --yellow:#FDC23C;
  --card:#F4F5F9; --tint:#E0E1E9; --line:#C4C7CF;
  --soft:#A9ABB6; --sec:#6C6E79; --cap:#484A54;
  --ink-card:#2B2E38; --ink-line:#484A54;
  --sh-sm:0 1px 2px rgba(25,27,35,.06); --sh:0 4px 16px rgba(25,27,35,.08); --sh-lg:0 12px 40px rgba(25,27,35,.14);
  --r-s:8px; --r:12px; --r-m:16px; --r-l:24px;
  --sidebar:248px; --topbar:60px;
  --font:'Inter','Noto Sans SC',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--card);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;overflow:hidden}
body.zh{--font:'Noto Sans SC','Inter',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:2px solid var(--card)}
::-webkit-scrollbar-track{background:transparent}

/* ---- wordmark ---- */
.mark{display:inline-flex;align-items:center;gap:.4em;font-weight:800;user-select:none}
.mark .spark{width:1.05em;height:1.05em;flex:none}
.mark .word{font-weight:800;letter-spacing:-.02em;font-size:1.28rem;color:var(--ink)}
.mark.on-ink .word{color:#fff}
.mark .sub{font-size:.56rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);display:block;margin-top:1px}

/* ---- primitives ---- */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.cta{background:var(--orange);color:#fff;font-weight:600;font-size:14px;padding:11px 22px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap}
.cta:hover{background:var(--orange-l)} .cta:active{background:var(--orange-d)}
.cta.sm{padding:8px 16px;font-size:13px}
.ghost{background:transparent;border:1.5px solid var(--tint);color:var(--ink);font-weight:600;font-size:14px;padding:9px 18px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.ghost:hover{border-color:var(--ink);background:#fff}
.ghost.sm{padding:6px 13px;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--tint);color:var(--sec);white-space:nowrap}
.check{display:inline-flex;align-items:center;justify-content:center;width:1.3em;height:1.3em;border-radius:50%;background:var(--orange);color:#fff;font-size:.7em;flex:none}
.card{background:#fff;border:1px solid var(--tint);border-radius:var(--r-m);padding:22px}
.card.grey{background:var(--card)}
.muted{color:var(--sec)} .soft{color:var(--soft)}
.hr{height:1px;background:var(--tint);border:0;margin:18px 0}
h1,h2,h3,h4{line-height:1.15;letter-spacing:-.02em}
.h-xl{font-size:34px;font-weight:800}.h-l{font-size:26px;font-weight:800}.h-m{font-size:20px;font-weight:700}.h-s{font-size:16px;font-weight:700}

/* ---- layout shell ---- */
#app{display:flex;height:100vh;width:100vw}
.sidebar{width:var(--sidebar);flex:none;background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:16px 12px;gap:2px}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:8px 10px 16px}
.nav-sec{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:#C4C7CF;font-weight:500;font-size:14px;transition:.13s;position:relative}
.nav-item:hover{background:var(--ink-card);color:#fff}
.nav-item.active{background:var(--ink-card);color:#fff;font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;background:var(--orange);border-radius:0 3px 3px 0}
.nav-item .ic{width:18px;height:18px;flex:none;opacity:.9}
.nav-item .tag{margin-left:auto;font-size:10px;font-weight:700;background:var(--orange);color:#fff;padding:1px 7px;border-radius:999px}
.nav-item .tag.v{background:var(--violet)}
.sidebar-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--ink-line);font-size:11px;color:var(--soft)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:var(--topbar);flex:none;background:#fff;border-bottom:1px solid var(--tint);display:flex;align-items:center;gap:14px;padding:0 22px;z-index:20}
.workspace{display:flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--tint);border-radius:10px;cursor:pointer;transition:.13s}
.workspace:hover{border-color:var(--line);background:var(--card)}
.ws-logo{width:30px;height:30px;border-radius:8px;background:#141519;display:flex;align-items:center;justify-content:center;flex:none}
.ws-meta b{font-size:13px;display:block;line-height:1.2}.ws-meta span{font-size:11px;color:var(--soft)}
.topbar-sp{flex:1}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--tint);border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--sec);transition:.13s;display:flex;align-items:center;gap:6px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh-sm)}
.seg.mode button.on[data-v="auto"]{color:var(--orange)}
.lang{display:inline-flex;border:1px solid var(--tint);border-radius:999px;overflow:hidden}
.lang button{padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--sec)}
.lang button.on{background:var(--ink);color:#fff}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#FF8C43,#C33909);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.view{flex:1;overflow-y:auto;padding:26px 30px 60px}
.view-w{max-width:1160px;margin:0 auto}
.page-head{margin-bottom:22px}
.page-head h1{font-size:27px;font-weight:800}
.page-head p{color:var(--sec);margin-top:5px;font-size:14.5px;max-width:640px}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--soft);margin-bottom:6px;flex-wrap:wrap}
.crumb b{color:var(--orange);font-weight:600}

/* ---- grids & tiles ---- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1080px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
.stat .n{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat .l{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin:8px 0 3px}
.stat .d{font-size:12.5px;color:var(--sec)}
.tile{background:#fff;border:1px solid var(--tint);border-radius:var(--r-m);padding:20px;transition:.15s}
.tile.link{cursor:pointer}.tile.link:hover{border-color:var(--line);box-shadow:var(--sh);transform:translateY(-2px)}
.tile .ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.ico.o{background:var(--orange-t);color:var(--orange-d)}.ico.v{background:#F1E9FE;color:var(--violet)}.ico.b{background:#E1F0FC;color:var(--blue)}.ico.g{background:#E1F5EF;color:var(--green)}

/* ---- ink panel ---- */
.ink-panel{background:var(--ink);color:#fff;border-radius:var(--r-l);padding:34px}
.ink-panel h2{color:#fff}.ink-panel .body{color:#C4C7CF;margin-top:10px}
.dark-card{background:var(--ink-card);border-left:3px solid var(--orange);border-radius:var(--r);padding:20px;color:#fff}
.dark-card .body{color:#C4C7CF;margin-top:8px;font-size:13.5px}

/* ---- pills / badges ---- */
.verdict{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:999px;color:#fff;white-space:nowrap}
.v-white{background:var(--orange)}.v-part{background:var(--orange-l)}.v-cont{background:var(--sec)}.v-block{background:var(--ink)}
.status{font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;color:#fff}
.s-rise{background:var(--green)}.s-vol{background:var(--orange)}.s-fall{background:var(--blue)}.s-flat{background:var(--soft)}
.badge-top{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#8B6B00;background:linear-gradient(90deg,#FFE9A8,#FDC23C);padding:3px 9px;border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.p1{color:var(--orange)}.bg-p1{background:var(--orange)}
.p2{color:var(--violet)}.bg-p2{background:var(--violet)}
.p3{color:var(--blue)}.bg-p3{background:var(--blue)}
.stage-chip{font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:6px;border:1px solid var(--tint);text-transform:uppercase}
.st-tofu{color:var(--blue);border-color:#BCDDF6}.st-mofu{color:var(--violet);border-color:#E0CFFA}.st-bofu{color:var(--orange);border-color:#FFD2B8}

/* ---- bars / charts ---- */
.bar-row{display:flex;align-items:center;gap:12px;margin:9px 0}
.bar-lab{width:230px;flex:none;font-size:13px;font-weight:600}

/* =========================================================================
   SHARED RENDER HELPERS
   ========================================================================= */
function scoreRing(sc,size){size=size||30;const r=(size-6)/2,c=2*Math.PI*r,off=c*(1-sc/100);
  const col=sc>=80?'#FDC23C':sc>=60?'var(--orange)':sc>=45?'var(--violet)':'var(--soft)';
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--tint)" stroke-width="3"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;}
function pdot(id){return `<span class="dot ${PILLAR_C[id].bg}"></span>`;}
function stageChip(st){return `<span class="stage-chip ${STAGE[st].cls}">${L(STAGE[st].lab)}</span>`;}
function bar(label,val,color,max){max=max||100;return `<div class="bar-row"><div class="bar-lab">${label}</div><div class="bar-track"><div class="bar-fill anim-bar" data-w="${(val/max*100).toFixed(1)}" style="width:0;background:${color}"></div></div><div class="bar-val">${val}%</div></div>`;}
function verdictPill(v){const m={white:['v-white',{en:'WHITESPACE',zh:'空白机会'}],part:['v-part',{en:'PARTIAL',zh:'部分'}],cont:['v-cont',{en:'CONTESTED',zh:'竞争激烈'}],block:['v-block',{en:'BLOCKED',zh:'已饱和'}]};return `<span class="verdict ${m[v][0]}">${L(m[v][1])}</span>`;}
function statusPill(s){const m={rise:['s-rise',{en:'Rising',zh:'上升'}],vol:['s-vol',{en:'Volatile',zh:'波动'}],fall:['s-fall',{en:'Falling',zh:'下降'}],flat:['s-flat',{en:'Flat',zh:'平稳'}]};return `<span class="status ${m[s][0]}">${L(m[s][1])}</span>`;}
function modeBadge(){return S.mode==='auto'?`<span class="tag-auto">● ${t('auto')}</span>`:`<span class="tag-man">${t('manual')}</span>`;}

function postCard(cr){const pil=pillar(cr.pillar);
  const actions=S.mode==='auto'
    ? `<span class="chip" style="color:var(--orange);border-color:#FFD2B8"><span class="check" style="width:1em;height:1em;font-size:.6em">${IC.check}</span>${cr.stage==='BOFU'?t('published'):t('scheduled')}</span>`
    : `<div class="mini-act"><button class="icobtn ok" title="${t('approve')}">${IC.check}</button><button class="icobtn" title="${t('edit')}">${IC.edit}</button><button class="icobtn no" title="${t('reject')}">${IC.x}</button></div>`;
  return `<div class="post reveal">
    <div class="creative" style="background:${cr.bg}">
      <span class="k">${cr.key}</span>
      ${cr.top?`<span class="badge-top">${IC.spark&&'★'} ${cr.score}% ${t('top_performer')}</span>`:''}
      <div class="hook">${L(cr.hook)}</div>
      <span class="brandtag">EXO<span style="color:#CE1B2B">S</span>TRIDE</span>
    </div>
    <div class="meta">
      <div class="row">${pdot(cr.pillar)}<b style="font-size:12px">${L(pil.persona)}</b>${stageChip(cr.stage)}<span class="chip">${L(cr.sub)}</span></div>
    </div>
    <div class="foot">
      <div class="score">${scoreRing(cr.score)}<div><div style="font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)">${t('clickability')}</div><b>${cr.score}%</b></div></div>
      ${actions}
    </div>
  </div>`;}

function runAnims(){requestAnimationFrame(()=>{document.querySelectorAll('.anim-bar').forEach(b=>{b.style.width=b.dataset.w+'%';});});}

/* =========================================================================
   MODAL SYSTEM
   ========================================================================= */
function openModal(html){const d=document.createElement('div');d.className='ovl';d.id='modal-x';d.addEventListener('click',e=>{if(e.target===d)closeModal();});d.innerHTML=html;document.getElementById('modal-root').appendChild(d);document.body.style.overflow='hidden';}
function closeModal(){const m=document.getElementById('modal-x');if(m)m.remove();document.body.style.overflow='';}

function doLogin(){
  const em=(document.getElementById('lg-email').value||'').trim().toLowerCase();
  const pw=document.getElementById('lg-pass').value||'';
  const err=document.getElementById('lg-err');
  if(!USERS[em]){err.textContent=L({en:'No account found for that email.',zh:'未找到该邮箱对应的账户。'});return;}
  if(pw!==PASSWORD){err.textContent=L({en:'Incorrect password. Try again.',zh:'密码不正确，请重试。'});return;}
  S.user=USERS[em];
  const lg=document.getElementById('login');if(lg)lg.remove();
  if(S.booted){renderShell();}else{renderOnboarding();}
}

function runOnboarding(){
  document.getElementById('ob-intro').style.display='none';
  document.getElementById('ob-run').style.display='block';
  let i=0;const steps=[...document.querySelectorAll('.ob-step')];
  function step(){
    if(i>0){steps[i-1].classList.remove('on');steps[i-1].classList.add('done');steps[i-1].querySelector('.s-ic').innerHTML='<span style="width:15px;height:15px;display:inline-block">'+IC.check+'</span>';}
    if(i>=steps.length){document.getElementById('ob-prog').style.width='100%';
      document.getElementById('ob-title').textContent=L({en:'Strategy ready.',zh:'策略已就绪。'});
      setTimeout(finishOnboarding,650);return;}
    steps[i].classList.add('on');steps[i].querySelector('.s-ic').innerHTML='<span class="spin"></span>';
    document.getElementById('ob-prog').style.width=((i+1)/steps.length*100)+'%';
    i++;setTimeout(step,i===1?900:1050);
  }
  step();
}

      ${S.mode==='manual'?`<button class="cta" style="width:100%;justify-content:center;margin-top:14px">${L({en:'Approve proposed budget shift',zh:'批准建议的预算调整'})}</button>`:`<div class="chip" style="width:100%;justify-content:center;margin-top:14px;color:var(--orange);border-color:#FFD2B8;padding:9px">${L({en:'Auto-reallocating hourly',zh:'每小时自动再分配'})}</div>`}

  <p class="muted" style="font-size:12.5px;margin-bottom:14px">${L({en:'Ads Autopilot runs your bottom-of-funnel creatives as paid ads across channels and flags fatigue automatically.',zh:'广告自动驾驶将你的漏斗底部素材作为付费广告投放于各渠道，并自动标记疲劳。'})}</p>
  <div class="grid g4">${adCards}</div>`;
